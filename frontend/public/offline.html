<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline | SwiftHealth Route</title>
<style>
/* The offline page of the service worker (public/sw.js). Plain HTML and CSS: it is shown with no network, so it needs nothing else. */
:root { color-scheme: light; --page: #f6f3ec; --surface: #ffffff; --ink: #1d2421; --line: #d7e1df; --blue: #1b6f93; }
:root[data-theme="dark"] { color-scheme: dark; --page: #060d18; --surface: #0d1a2e; --ink: #eaf1fa; --line: #1d2e48; --blue: #2b6fc4; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 1rem; line-height: 1.5; }
main { max-width: 28rem; margin: 0 auto; padding: 2.5rem 1rem; display: flex; flex-direction: column; gap: 1rem; }
h1 { margin: 0; font-size: 1.5rem; line-height: 1.25; }
p { margin: 0; font-size: 1rem; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 1rem; padding: 1rem; display: flex; flex-direction: column; gap: 0.75rem; }
.actions { display: grid; grid-template-columns: 1fr; gap: 0.75rem; }
.call, .link, button { display: flex; align-items: center; justify-content: center; min-height: 50px; padding: 0 1rem; border-radius: 0.75rem; font: inherit; font-size: 1rem; font-weight: 600; text-decoration: none; cursor: pointer; }
.call { background: #b3261e; color: #ffffff; border: 0; }
.link, button { background: var(--surface); color: var(--ink); border: 1px solid var(--blue); }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
</style>
<script>
/* The same choice of theme as the site: Light unless the visitor chose Dark (or System and the system is dark). */
try {
  var kept = window.localStorage.getItem("swifthealth.theme");
  var dark = kept === "dark" || (kept === "system" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
} catch (error) {
  document.documentElement.setAttribute("data-theme", "light");
}
</script>
</head>
<body>
<main>
<h1>SwiftHealth Route</h1>
<div class="card">
<p>You're offline. SwiftRescue still works: call 112.</p>
<div class="actions">
<a class="call" href="tel:112">Call 112</a>
<a class="link" href="/emergency">Open SwiftRescue</a>
<button type="button" onclick="window.location.reload()">Try again</button>
</div>
</div>
</main>
</body>
</html>
