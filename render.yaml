# Render Blueprint for the SwiftHealth API (NFR-05, NFR-06). Spec: specs/2026-10-08-walking-skeleton-production/.
# Secret values never go in this file: JWT_SECRET and REPORTER_KEY_SECRET are generated by Render, and the two database
# addresses (DATABASE_URL, DATABASE_URL_DIRECT) are set by hand in the dashboard.
# The free API sleeps after 15 minutes. THE DATABASE MOVED TO NEON (specs/2026-10-28-neon-database/): the API no longer
# uses the Render database below. It is kept on purpose, untouched, until it expires (about 2026-11-07), as the way back.

databases:
  # NOT USED by the API since the move to Neon, and NOT deleted: it stays until it expires, so a rollback is one variable
  # away. Do not remove this block while the database exists (the Blueprint spec does not say what removing it does).
  # After it has expired, remove the block in a pull request, so a later sync does not try to create it again.
  - name: swifthealth-db
    plan: free
    region: frankfurt # closest Render region to Nigeria in the Blueprint spec; the service must use the same one
    ipAllowList: [] # no outside connections (a sync puts this back). The move needed one address allowed for a while, by hand.

services:
  - type: web
    name: swifthealth-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production # turns on the JWT_SECRET check in core/config.py
      - key: DATABASE_URL
        # A SECRET, set by hand in the Render dashboard (Environment); never in this file. It is Neon's POOLED address (the host has
        # `-pooler`): the one the API uses for every request. core/config.py adds the psycopg driver and, for a Neon host
        # without it, `sslmode=require`. `sync: false`: Render asks for the value only when a service is first created from the
        # Blueprint and ignores the variable when an existing Blueprint is updated, so this line never overwrites the dashboard value.
        # Until 2026-10-28 this was a `fromDatabase` link to the Render database below. Runbook: specs/2026-10-28-neon-database/runbook.md.
        sync: false
      - key: DATABASE_URL_DIRECT
        # A SECRET, set by hand in the dashboard: Neon's DIRECT address (the same address without `-pooler`). Only Alembic uses it
        # (backend/alembic/env.py): migrations run at every start (backend/Dockerfile) and must not go through the pooler. If it is
        # not set, Alembic uses DATABASE_URL, which is right for a database without a pooler.
        sync: false
      - key: JWT_SECRET
        generateValue: true # Render makes a random 256-bit value (base64), longer than the 32 bytes we require
      - key: SEED_DEMO_LISTINGS
        # "true" adds a few fictional DEMO listings when the service starts (seed/demo_listings.py). Set it to true in
        # the dashboard, let the service restart, then set it back to false. Only the exact text "true" counts.
        value: "false"
      - key: REMOVE_DEMO_LISTINGS
        # "true" deletes exactly those demo listings when the service starts. Part of the launch checklist.
        value: "false"
      - key: REPORTER_KEY_SECRET
        # Keys the hash that counts different reporters for FR-22. A separate value from JWT_SECRET, so rotating
        # the JWT secret does not break the counting. The API refuses to start without it (core/config.py).
        generateValue: true
      - key: CORS_ORIGINS
        # An address is not a secret, so it is a plain value. With `sync: false` Render asked for it only when the
        # Blueprint was first created and left it out afterwards. https, no trailing slash.
        value: https://swifthealth-ng.netlify.app
      - key: TRUSTED_PROXY_COUNT
        # Counted from a real request through Render on 2026-10-08: X-Forwarded-For is
        # "client, Cloudflare address, Render load balancer address", so the client is the 3rd entry from the end.
        # Recount if Render changes its proxies (see the phase 4 requirements, decision 5).
        value: "3"
