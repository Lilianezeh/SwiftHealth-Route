# Render Blueprint for the SwiftHealth API (NFR-05, NFR-06). Spec: specs/2026-10-08-walking-skeleton-production/.
# Secret values never go in this file: JWT_SECRET is generated by Render and CORS_ORIGINS is typed in the dashboard.
# Both plans are "free" for the skeleton. The free API sleeps after 15 minutes and the free database expires 30 days
# after creation and has no backups, so upgrade both before launch (roadmap phases 14b and 14d).

databases:
  - name: swifthealth-db
    plan: free
    region: frankfurt # closest Render region to Nigeria in the Blueprint spec; the service must use the same one
    ipAllowList: [] # no outside connections; the API reaches the database over Render's private network

services:
  - type: web
    name: swifthealth-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production # turns on the JWT_SECRET check in core/config.py
      - key: DATABASE_URL
        fromDatabase:
          name: swifthealth-db
          property: connectionString # `postgresql://...`; core/config.py adds the psycopg driver
      - key: JWT_SECRET
        generateValue: true # Render makes a random 256-bit value (base64), longer than the 32 bytes we require
      - key: CORS_ORIGINS
        sync: false # the Netlify address, for example https://your-site.netlify.app (no trailing slash)
      - key: TRUSTED_PROXY_COUNT
        value: "1" # placeholder: Task 3 counts the real X-Forwarded-For entries and sets the right number
