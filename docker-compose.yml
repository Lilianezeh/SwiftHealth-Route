services:
  db:
    image: postgres:18  # same major version as the Render database
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-swifthealth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-swifthealth}
      POSTGRES_DB: ${POSTGRES_DB:-swifthealth}
    volumes: [pgdata:/var/lib/postgresql]  # postgres:18 keeps its data in /var/lib/postgresql/18/docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-swifthealth}"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    # Local only: run as uid 1000, gid 1000 (the same ids as the first user of a normal Linux or WSL install) so the files that the
    # container writes into the mounted ./backend (__pycache__, .pytest_cache, .ruff_cache) are yours, not root's. It is set here
    # and not in backend/Dockerfile, because Render builds that Dockerfile for production (render.yaml) and this change is not tested there.
    user: "1000:1000"
    env_file: .env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes: [./backend:/app]
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db: { condition: service_healthy }

  frontend:
    build: ./frontend
    env_file: .env
    command: npm run dev
    # netlify.toml (read-only, at /netlify.toml, next to /app) lets tests/unit/homePerformance.test.tsx read the cache headers.
    volumes: [./frontend:/app, /app/node_modules, "./netlify.toml:/netlify.toml:ro"]
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [backend]

volumes:
  pgdata:
