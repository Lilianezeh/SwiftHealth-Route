services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-swifthealth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-swifthealth}
      POSTGRES_DB: ${POSTGRES_DB:-swifthealth}
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-swifthealth}"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes: [./backend:/app]
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db: { condition: service_healthy }

  frontend:
    build: ./frontend
    env_file: .env
    command: npm run dev
    volumes: [./frontend:/app, /app/node_modules]
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [backend]

volumes:
  pgdata:
