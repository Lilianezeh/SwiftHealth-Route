name: Frontend CI
on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/frontend.yml"]
  pull_request:
    paths: ["frontend/**", ".github/workflows/frontend.yml"]
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - run: bash ../scripts/check-node-version.sh # the Dockerfile, netlify.toml, this file and @types/node agree
      - run: npm install
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
