# Netlify settings for the SwiftHealth frontend (NFR-05, NFR-06). Spec: specs/2026-10-08-walking-skeleton-production/.
# The site lives in frontend/, so the build runs from there. `publish` is relative to `base`, so ".next" means
# frontend/.next. The plugin line is the Next.js adapter (OpenNext); it is declared here so the settings do not depend on
# clicking "Runtime" and the publish directory in the Netlify dashboard (phase 4 requirements, decision 9).
# No secrets here. NEXT_PUBLIC_API_URL is typed in the Netlify dashboard with the "Builds" scope.

[build]
  base = "frontend"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "24" # the same major version as frontend/Dockerfile and the frontend CI workflow (Node 20 ended 2026-04-30)

[[plugins]]
  package = "@netlify/plugin-nextjs"

# The photos of the home page are cached for a year (the owner, 2026-10-13: Lighthouse 37; the photos were sent with max-age=0 and
# revalidated on every visit). /_next/static already has the same header from the Netlify Next.js runtime (checked on the preview).
# Because of this, a NEW photo must get a NEW file name (hero3, hero4-portrait did): a replaced file with the same name would
# stay in visitors' caches. Spec: specs/2026-10-11-home-redesign/ (R42). The path is relative to the site, not to `base`.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The service worker of SwiftRescue (FR-17, NFR-03). The browser must check for a new version of the file every time, or an old
# worker could outlive a fix. The worker itself is plain JavaScript in frontend/public/sw.js; spec: specs/2026-10-17-swiftrescue/.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
